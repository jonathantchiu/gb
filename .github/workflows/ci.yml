name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Window system headers (minifb)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
      - name: Build
        run: cargo build --workspace --all-targets --release
      - name: ROM suite (ratchet)
        run: cargo test --workspace --release
      - name: Pass rate
        run: cargo run -p gb-tests --release --bin ratchet | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
